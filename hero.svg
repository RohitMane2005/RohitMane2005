<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E63946" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#E63946" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#E63946" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E63946" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E63946" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E63946" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#F5F5F5" stroke-width="0.5" opacity="0.06"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="900" height="420" rx="4"/>
    </clipPath>
  </defs>

  <!-- LAYER 1: background -->
  <rect width="900" height="420" fill="#050505"/>

  <g clip-path="url(#frame)">
    <!-- LAYER 2: grid -->
    <g>
      <rect width="900" height="420" fill="url(#grid)"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 36 36; 0 0" dur="30s" repeatCount="indefinite"/>
    </g>

    <!-- LAYER 3: ambient glow behind core -->
    <circle cx="450" cy="150" r="140" fill="url(#coreGlow)"/>

    <!-- LAYER 4: particles orbiting the core -->
    <g fill="#E63946">
      <circle r="1.6" opacity="0.6">
        <animateMotion dur="9s" repeatCount="indefinite"
          path="M 450,60 A 95,95 0 1,1 449.9,60"/>
      </circle>
      <circle r="1.3" opacity="0.45">
        <animateMotion dur="14s" repeatCount="indefinite"
          path="M 450,220 A 70,70 0 1,0 449.9,220"/>
      </circle>
      <circle r="1.1" opacity="0.35">
        <animateMotion dur="20s" repeatCount="indefinite"
          path="M 450,25 A 125,125 0 1,1 449.9,25"/>
      </circle>
    </g>

    <!-- LAYER 5: orbital rings -->
    <g fill="none" stroke="#E63946">
      <circle cx="450" cy="150" r="95" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 6">
        <animateTransform attributeName="transform" type="rotate"
          from="0 450 150" to="360 450 150" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="450" cy="150" r="125" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="1 10">
        <animateTransform attributeName="transform" type="rotate"
          from="360 450 150" to="0 450 150" dur="20s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- LAYER 6: core -->
    <circle cx="450" cy="150" r="7" fill="#E63946">
      <animate attributeName="r" values="6;9;6" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="150" r="7" fill="none" stroke="#E63946" stroke-opacity="0.4">
      <animate attributeName="r" values="7;26;7" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- LAYER 7: scanline -->
    <rect x="0" width="900" height="18" fill="url(#scanGrad)">
      <animate attributeName="y" values="-18;420" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- LAYER 8: system status -->
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="11" letter-spacing="2">
      <circle cx="345" cy="266" r="3" fill="#E63946">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="356" y="270" fill="#A0A0A0">SYSTEM ONLINE</text>
    </g>

    <!-- LAYER 9: name + tagline -->
    <text x="450" y="320" text-anchor="middle" font-family="Inter, Arial, sans-serif"
      font-size="46" font-weight="700" letter-spacing="6" fill="#F5F5F5">ROHIT</text>
    <text x="450" y="346" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace"
      font-size="13" letter-spacing="4" fill="#A0A0A0">SOFTWARE ENGINEER</text>
    <text x="450" y="378" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace"
      font-size="11" letter-spacing="3" fill="#666666">JAVA // SPRING BOOT // REACT</text>
  </g>

  <!-- frame border -->
  <rect x="0.5" y="0.5" width="899" height="419" fill="none" stroke="#1A1A1A"/>
</svg>
